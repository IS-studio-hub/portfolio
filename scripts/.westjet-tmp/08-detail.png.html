<!DOCTYPE html><html><head><style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:1600px;height:1000px;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 70% 55% at 50% 40%, rgba(14,165,168,0.14) 0%, transparent 65%),
    radial-gradient(ellipse 90% 70% at 50% 100%, rgba(255,255,255,0.03) 0%, transparent 50%),
    linear-gradient(165deg, #0a0a0a 0%, #050505 50%, #0f0f0f 100%);
;font-family:system-ui,sans-serif;overflow:hidden}
    .glow{position:absolute;width:55%;height:40%;bottom:8%;left:22%;background:rgba(14,165,168,0.1);filter:blur(80px);border-radius:50%}
    .phone{position:relative;z-index:1;width:320px;background:transparent;filter:drop-shadow(0 28px 56px rgba(0,0,0,.55))}
    .phone.lg{width:360px}
    .phone.sm{width:260px}
    .phone img{width:100%;display:block;border-radius:44px}
    .frame{position:relative;z-index:1;width:320px;background:#111;border-radius:44px;padding:14px;border:2px solid #333;filter:drop-shadow(0 28px 56px rgba(0,0,0,.55))}
    .frame.lg{width:360px}
    .frame img{width:100%;display:block;border-radius:32px}
    .card{position:relative;z-index:1;width:420px;background:#161616;border-radius:20px;padding:20px;border:1px solid #2a2a2a;filter:drop-shadow(0 24px 48px rgba(0,0,0,.5))}
    .card img{width:100%;display:block;border-radius:12px}
    .panel{position:relative;z-index:1;width:1320px;max-height:880px;border-radius:16px;overflow:hidden;border:1px solid #2a2a2a;background:#111;filter:drop-shadow(0 28px 60px rgba(0,0,0,.55))}
    .panel img{width:100%;display:block}
    .row{display:flex;gap:28px;align-items:flex-end;position:relative;z-index:1}
    .trio{display:flex;gap:22px;align-items:flex-end;position:relative;z-index:1}
    .quad{display:flex;gap:16px;align-items:flex-end;position:relative;z-index:1}
  </style></head><body>
  <div class="glow"></div><div class="row">
  <div class="phone"><img src="file:///Users/shamrikin/Desktop/ISstudio/Work/CGI Portfolio/public/projects/westjet/raw/20-notification.png"/></div>
  <div class="phone"><img src="file:///Users/shamrikin/Desktop/ISstudio/Work/CGI Portfolio/public/projects/westjet/raw/30-fj-map.png"/></div>
  </div></body></html>
