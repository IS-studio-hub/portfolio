<!DOCTYPE html><html><head><style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width:1600px; height:1000px;
      display:flex; align-items:center; justify-content:center;
      
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, rgba(249,115,22,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 90% 70% at 50% 100%, rgba(255,255,255,0.03) 0%, transparent 50%),
    linear-gradient(165deg, #0a0a0a 0%, #050505 50%, #0f0f0f 100%);

      font-family:system-ui,sans-serif; overflow:hidden;
    }
    .glow { position:absolute; width:55%; height:40%; bottom:8%; left:22%;
      background:rgba(249,115,22,0.08); filter:blur(80px); border-radius:50%; }
    .phone { position:relative; z-index:1; width:320px; background:#111; border-radius:44px; padding:14px; border:2px solid #333;
      filter: drop-shadow(0 28px 56px rgba(0,0,0,0.55)); }
    .phone.lg { width:360px; }
    .phone__display { border-radius:32px; overflow:hidden; background:#111; }
    .phone__display img { width:100%; display:block; }
    .row { display:flex; gap:28px; align-items:flex-end; position:relative; z-index:1; }
    .row .phone { width:280px; }
    .trio { display:flex; gap:22px; align-items:flex-end; position:relative; z-index:1; }
    .trio .phone { width:260px; }
    .laptop { position:relative; z-index:1; width:1000px; filter:drop-shadow(0 32px 64px rgba(0,0,0,0.6)); }
    .laptop__screen { background:#1a1a1a; border-radius:16px 16px 0 0; padding:12px 12px 8px; border:2px solid #2a2a2a; }
    .laptop__display { border-radius:6px; overflow:hidden; background:#111; }
    .laptop__display img { width:100%; display:block; max-height:780px; object-fit:cover; object-position:top; }
    .laptop__base { height:14px; background:linear-gradient(180deg,#333,#222); border-radius:0 0 10px 10px; margin:0 40px; }
  </style></head><body>

      <div class="phone"><div class="phone__display"><img src="file:///Users/shamrikin/Desktop/ISstudio/Work/CGI Portfolio/public/projects/anova/raw/05-cooking.png" /></div></div>
    </div>
  </body></html>
