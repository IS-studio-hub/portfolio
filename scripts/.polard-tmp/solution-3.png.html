<!DOCTYPE html><html><head><style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:1600px;height:1000px;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 70% 55% at 50% 40%, rgba(124,58,237,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 90% 70% at 50% 100%, rgba(255,255,255,0.03) 0%, transparent 50%),
    linear-gradient(165deg, #0a0a0a 0%, #050505 50%, #0f0f0f 100%);
;font-family:system-ui,sans-serif;overflow:hidden}
    .glow{position:absolute;width:60%;height:40%;bottom:6%;left:20%;background:rgba(124,58,237,0.1);filter:blur(90px);border-radius:50%}
    .browser{position:relative;z-index:1;width:1280px;background:#161616;border-radius:14px;border:1px solid #2a2a2a;overflow:hidden;filter:drop-shadow(0 28px 60px rgba(0,0,0,.55))}
    .browser.lg{width:1380px}
    .chrome{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#1c1c1c;border-bottom:1px solid #2a2a2a}
    .dot{width:10px;height:10px;border-radius:50%;background:#3a3a3a}
    .dot:nth-child(1){background:#ff5f57}.dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#28c840}
    .url{margin-left:12px;flex:1;height:22px;border-radius:6px;background:#111;border:1px solid #2a2a2a}
    .screen{background:#111;max-height:860px;overflow:hidden}
    .screen img{width:100%;display:block}
    .phone{position:relative;z-index:1;width:280px;background:#111;border-radius:40px;padding:12px;border:2px solid #333;filter:drop-shadow(0 24px 48px rgba(0,0,0,.55))}
    .phone img{width:100%;display:block;border-radius:30px;max-height:640px;object-fit:cover;object-position:top}
    .row{display:flex;gap:24px;align-items:center;position:relative;z-index:1}
    .row .browser{width:900px}
    .row .browser .screen{max-height:720px}
    .trio{display:flex;gap:18px;align-items:flex-end;position:relative;z-index:1}
    .panel{position:relative;z-index:1;width:1320px;max-height:900px;border-radius:16px;overflow:hidden;border:1px solid #2a2a2a;background:#111;filter:drop-shadow(0 28px 60px rgba(0,0,0,.55))}
    .panel img{width:100%;display:block}
  </style></head><body>
  <div class="glow"></div><div class="row">
  <div class="browser" style="width:720px"><div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="url"></div></div>
  <div class="screen" style="max-height:680px"><img src="file:///Users/shamrikin/Desktop/ISstudio/Work/CGI Portfolio/public/projects/polard/raw/06-licensing.png"/></div></div>
  <div class="browser" style="width:720px"><div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="url"></div></div>
  <div class="screen" style="max-height:680px"><img src="file:///Users/shamrikin/Desktop/ISstudio/Work/CGI Portfolio/public/projects/polard/raw/08-components-table.png"/></div></div>
  </div></body></html>
